backend:
  name: github
  repo: mviala10/portafolio-manuel-vial
  branch: main

publish_mode: simple
media_folder: "assets/img"
public_folder: "/assets/img"

locale: "es"

collections:
  - name: "settings"
    label: "Datos del sitio"
    files:
      - file: "content/settings.json"
        name: "settings"
        label: "Información general"
        fields:
          - { label: "Nombre / título del sitio", name: "siteTitle", widget: "string" }
          - { label: "Rol o cargo (ej: Director de Arte & Director Creativo)", name: "role", widget: "string", required: false }
          - { label: "Frase corta (tagline, debajo del rol)", name: "tagline", widget: "string", required: false }
          - label: "Bio / descripción (portada)"
            name: "about"
            widget: "text"
            required: false
            hint: "Aparece bajo tu nombre en la portada. 2-3 líneas ideal."
          - label: "Video de fondo de portada"
            name: "heroVideo"
            widget: "file"
            required: false
            media_folder: "/assets/video"
            public_folder: "/assets/video"
            hint: "Video corto (10-20 segundos) en loop, sin sonido. Formato MP4, lo más liviano posible (idealmente menos de 15 MB) para que cargue rápido."
          - { label: "Email de contacto", name: "email", widget: "string", required: false }
          - label: "Redes o enlaces"
            name: "socialLinks"
            widget: "list"
            required: false
            fields:
              - { label: "Nombre a mostrar", name: "label", widget: "string" }
              - { label: "Enlace", name: "url", widget: "string" }
          - label: "Texto de pasiones"
            name: "pasiones"
            widget: "text"
            required: false
            hint: "Párrafo sobre tus pasiones (deporte, música, impacto social, etc.)."
          - label: "Etiquetas de pasiones"
            name: "pasionesTags"
            widget: "list"
            required: false
            field: { label: "Etiqueta", name: "tag", widget: "string" }
          - label: "Trayectoria (línea de tiempo)"
            name: "trayectoria"
            widget: "list"
            required: false
            label_singular: "Etapa"
            summary: "{{organizacion}} — {{periodo}}"
            fields:
              - { label: "Organización (si son dos, sepáralas con 'y')", name: "organizacion", widget: "string" }
              - { label: "Período (ej: 5 años, o Desde 2024)", name: "periodo", widget: "string" }
              - { label: "Descripción breve", name: "descripcion", widget: "text", required: false }
              - label: "Logo"
                name: "logo"
                widget: "image"
                required: false
                media_folder: "/assets/img/logos"
                public_folder: "/assets/img/logos"
              - label: "Segundo logo (opcional, si son dos organizaciones en esta etapa)"
                name: "logo2"
                widget: "image"
                required: false
                media_folder: "/assets/img/logos"
                public_folder: "/assets/img/logos"

  - name: "portfolio"
    label: "Trabajos"
    files:
      - file: "content/portfolio.json"
        name: "portfolio"
        label: "Todos los trabajos"
        fields:
          - label: "Trabajos"
            name: "items"
            widget: "list"
            label_singular: "Trabajo"
            summary: "{{title}} — {{type}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - label: "Tipo de trabajo"
                name: "type"
                widget: "select"
                options:
                  - { label: "Video", value: "video" }
                  - { label: "Gráfica", value: "graphic" }
              - label: "Categoría de proyecto"
                name: "categoria"
                widget: "select"
                required: false
                hint: "Define en qué pestaña horizontal aparece este trabajo en la sección Proyectos."
                options:
                  - { label: "Creación de marca Atlético Colina", value: "marca-colina" }
                  - { label: "Trabajo Gráfico Atlético Colina", value: "grafica-colina" }
                  - { label: "Creación de videos con IA", value: "ia" }
                  - { label: "Videos Cambiemos Chile", value: "cambiemos" }
                  - { label: "Otro", value: "otro" }
              - { label: "Descripción", name: "description", widget: "text", required: false }
              - label: "Enlace de video (YouTube o Vimeo)"
                name: "videoUrl"
                widget: "string"
                required: false
                hint: "Solo si el tipo es Video. Pega el link normal, por ejemplo https://youtu.be/xxxxx o https://vimeo.com/xxxxx."
              - label: "Imagen"
                name: "image"
                widget: "image"
                required: false
                hint: "Obligatoria si el tipo es Gráfica. Para Video es opcional: si no subes una, se usa la miniatura de YouTube automáticamente (Vimeo no la genera sola)."
              - { label: "Cliente o proyecto", name: "client", widget: "string", required: false }
              - { label: "Año", name: "year", widget: "number", value_type: "int", required: false }
              - label: "Etiquetas"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Etiqueta", name: "tag", widget: "string" }
